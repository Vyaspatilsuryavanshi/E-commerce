{% extends 'base.html' %}
{% block title %}Check Your Email | AURA LUXE{% endblock %}
{% block content %}
<div class="container" style="max-width:560px; padding:64px 16px 96px;">
  <div class="checkout-card" style="text-align:center;">
    <h1 style="font-family:var(--font-serif); font-size:2rem; margin-bottom:12px;">Check your email</h1>
    <p style="color:var(--text-muted);">If an active account uses that email address, a password reset link has been sent. Check your inbox and spam folder.</p>
    <a href="{% url 'accounts:login' %}" class="btn btn-primary" style="margin-top:24px;">Return to sign in</a>
  </div>
</div>
{% endblock %}
